version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GENESYS_SERVER: ${GENESYS_SERVER}
        GENOTYPE_MAPPING_SOURCE: ${GENOTYPE_MAPPING_SOURCE}
        VITE_DEFAULT_INSTITUTE_CODE: ${VITE_DEFAULT_INSTITUTE_CODE}
        VITE_GENOTYPE_FILTER_STATUS: ${VITE_GENOTYPE_FILTER_STATUS}
        VITE_PLATFORM: ${VITE_PLATFORM}
        VITE_REQUIRE_GIGWA_CREDENTIALS: ${VITE_REQUIRE_GIGWA_CREDENTIALS}
        BASE_PATH: ${BASE_PATH}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    environment:
      # Backend-Variables
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_DIALECT: ${DB_DIALECT}
      GERMINATE_SERVER: ${GERMINATE_SERVER}
      GIGWA_SERVERS: ${GIGWA_SERVERS}
      GENESYS_SERVER: ${GENESYS_SERVER}
      GENESYS_CLIENT_ID: ${GENESYS_CLIENT_ID}
      GENESYS_CLIENT_SECRET: ${GENESYS_CLIENT_SECRET}
      GENOLINK_ORIGIN: ${GENOLINK_ORIGIN}
      GENOTYPE_MAPPING_SOURCE: ${GENOTYPE_MAPPING_SOURCE}
      BASE_PATH: ${BASE_PATH}
      APP_PORT: ${APP_PORT}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-100mb}
      EXPORT_MAX_CONCURRENT: ${EXPORT_MAX_CONCURRENT:-2}
      EXPORT_UPSTREAM_TIMEOUT_MS: ${EXPORT_UPSTREAM_TIMEOUT_MS:-30000}
      EXPORT_TOTAL_TIMEOUT_MS: ${EXPORT_TOTAL_TIMEOUT_MS:-600000}
      EXPORT_POLL_INTERVAL_MS: ${EXPORT_POLL_INTERVAL_MS:-2000}

    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./back/uploads:/app/back/uploads
      - ./back/logs:/app/back/logs

  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
